<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Leftover</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="window">
    <aside class="sidebar">
      <div class="brand">
        <img src="icon.svg" alt="" width="24" height="24">
        <span>Leftover</span>
      </div>
      <nav id="nav">
        <a class="nav" data-view="overview" href="#overview"><span class="tile tile-overview"><i class="tile-ring"></i></span><span class="nav-text">Overview</span></a>
        <div class="nav-head">Categories</div>
        <div id="nav-cats"></div>
        <div class="nav-head">Safety net</div>
        <a class="nav" data-view="vault" href="#vault"><span class="tile tile-vault"><i class="tile-box"></i></span><span class="nav-text">Vault</span><span class="badge" id="count-vault" hidden></span></a>
        <a class="nav" data-view="history" href="#history"><span class="tile tile-plain"><i class="ico ico-history"></i></span><span class="nav-text">History</span></a>
        <div class="nav-head">More</div>
        <a class="nav" data-view="keep" href="#keep"><span class="tile tile-keep"><i class="ico ico-lock"></i></span><span class="nav-text">Your data</span><span class="meta" id="count-keep"></span></a>
        <a class="nav" data-view="explore" href="#explore"><span class="tile tile-plain"><i class="ico ico-explore"></i></span><span class="nav-text">Explore</span></a>
        <a class="nav" data-view="why" href="#why"><span class="tile tile-plain"><i class="ico ico-why"></i></span><span class="nav-text">What's this?</span></a>
        <a class="nav" data-view="settings" href="#settings"><span class="tile tile-plain"><i class="ico ico-settings"></i></span><span class="nav-text">Settings</span></a>
      </nav>
      <div class="disk" id="disk" hidden>
        <div class="disk-head"><span id="disk-name"></span><span id="disk-total"></span></div>
        <div class="disk-bar"><i id="disk-used"></i><i id="disk-left"></i></div>
        <span class="disk-note" id="disk-note"></span>
      </div>
      <div class="sidebar-foot">
        <i class="ico ico-lock"></i><span>Runs only on this computer</span><span class="version" id="version"></span>
      </div>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div class="titles">
          <h1 id="title">Overview</h1>
          <span id="subtitle"></span>
        </div>
        <label class="search-field">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.8"/><path d="M10.6 10.6L14 14"/></svg>
          <input id="search" type="search" placeholder="Search leftovers" autocomplete="off" spellcheck="false" aria-label="Search leftovers">
        </label>
        <button id="scan-btn" class="icon-btn" title="Scan again (⌘R)" aria-label="Scan again">
          <svg class="i-scan" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8A5.5 5.5 0 1 1 11.6 3.8"/><path d="M12 1.5v2.8H9.2"/></svg>
          <svg class="i-stop" width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2" fill="currentColor"/></svg>
        </button>
        <div id="scanbar" class="scanbar" hidden><i></i></div>
      </header>
      <div class="content">
        <section id="view" class="view" aria-live="polite"></section>
        <aside id="inspector" class="inspector" hidden></aside>
      </div>
      <div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="toast-undo" type="button" hidden>Undo</button></div>
    </main>
  </div>

  <div id="sheet" class="sheet-backdrop" hidden>
    <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="sheet-title">
      <img src="icon.svg" alt="" width="52" height="52">
      <h2 id="sheet-title"></h2>
      <div id="sheet-body"></div>
      <div class="sheet-buttons">
        <button id="sheet-cancel" class="btn">Cancel</button>
        <button id="sheet-ok" class="btn btn-primary"></button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
