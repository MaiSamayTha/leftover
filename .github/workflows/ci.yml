name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run for the push before it.
# Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: test (windows)
        if: runner.os == 'Windows'
        run: go test ./...
      - name: end to end
        shell: bash
        run: sh scripts/e2e.sh

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build every release target
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/leftover
            echo "ok $target"
          done
      - name: no third-party dependencies
        run: |
          if grep -q '^require' go.mod; then
            echo "go.mod has dependencies; Leftover promises standard library only" && exit 1
          fi

  # Installs the latest published release with the real install scripts and
  # uses it the way a person would, on every OS. Windows uses Windows
  # PowerShell 5.1, which is what "irm ... | iex" runs in by default.
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: install the release and use it
        if: runner.os != 'Windows'
        run: sh scripts/smoke.sh
      - name: install the release and use it
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # A throwaway profile outside the real %TEMP%.
          $h = Join-Path $env:RUNNER_TEMP "home"
          $env:USERPROFILE = $h
          $env:LOCALAPPDATA = Join-Path $h "AppData\Local"
          $env:APPDATA = Join-Path $h "AppData\Roaming"
          $env:TEMP = Join-Path $env:LOCALAPPDATA "Temp"; $env:TMP = $env:TEMP
          $env:NO_COLOR = "1"
          $startMenu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA, $env:APPDATA, $env:TEMP, $startMenu | Out-Null

          Get-Content -Raw scripts/install.ps1 | Invoke-Expression
          $lnk = Join-Path ([Environment]::GetFolderPath("Programs")) "Leftover.lnk"
          if (-not (Test-Path $lnk)) { throw "no Start menu shortcut at $lnk" }

          $bin = Join-Path $env:LOCALAPPDATA "Programs\Leftover\leftover.exe"
          function L { $out = & $bin @args | Out-String; if ($LASTEXITCODE) { throw "leftover $args failed: $out" }; $out }
          $v = L --version; Write-Host $v
          if ($v -notmatch "^leftover \d") { throw "--version didn't print a version" }

          $web = Join-Path $h "code\web"
          New-Item -ItemType Directory -Force (Join-Path $web "node_modules\react") | Out-Null
          Set-Content (Join-Path $web "package.json") "{}"
          [IO.File]::WriteAllBytes((Join-Path $web "node_modules\react\index.js"), (New-Object byte[] 3000000))

          $scan = L scan -q; Write-Host $scan
          if ($scan -notmatch "node_modules") { throw "scan didn't find node_modules" }
          if ((L why (Join-Path $web "node_modules")) -notmatch "Downloads again") { throw "why gave the wrong verdict" }

          L clean --yes | Write-Host
          if (Test-Path (Join-Path $web "node_modules")) { throw "node_modules still there after clean" }
          $id = (L vault --json | ConvertFrom-Json)[0].id
          L vault restore $id | Write-Host
          if (-not (Test-Path (Join-Path $web "node_modules\react\index.js"))) { throw "restore didn't bring node_modules back" }

          L clean --yes | Out-Null
          L vault empty --yes | Out-Null
          if ((L vault --json) -replace "\s", "" -ne "[]") { throw "vault not empty after emptying" }
          Write-Host "smoke: installed and used $v on Windows"

  # Builds the downloadable apps (Leftover.dmg, Leftover-Setup.exe, the .deb)
  # and goes through what a person does with each: install it, open it from
  # where the OS puts it, see the window's server come up, uninstall.
  packages:
    name: app package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Leftover.dmg
        if: runner.os == 'macOS'
        run: |
          set -eu
          sh scripts/package-macos.sh 0.0.0 dist
          mnt=$(mktemp -d)
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mnt" dist/Leftover.dmg
          [ -L "$mnt/Applications" ] || { echo "no Applications shortcut in the dmg"; exit 1; }
          # Dragging Leftover onto Applications is a copy.
          cp -R "$mnt/Leftover.app" "$RUNNER_TEMP/"
          hdiutil detach -quiet "$mnt"
          app="$RUNNER_TEMP/Leftover.app"
          lipo -archs "$app/Contents/MacOS/Leftover" | grep -q x86_64
          lipo -archs "$app/Contents/MacOS/Leftover" | grep -q arm64
          codesign --verify --strict "$app"
          plutil -lint "$app/Contents/Info.plist"
          # The updater's zip must unpack to the same, still-signed app.
          upd=$(mktemp -d)
          ditto -x -k dist/Leftover-macos.zip "$upd"
          codesign --verify --strict "$upd/Leftover.app"
          "$app/Contents/MacOS/Leftover" --version
          # Open it the way a double-click does and wait for the window's server.
          open "$app"
          for i in $(seq 1 30); do
            pid=$(pgrep -f "Leftover.app/Contents/MacOS/Leftover" || true)
            [ -n "$pid" ] && lsof -nP -a -p "$pid" -iTCP@127.0.0.1 -sTCP:LISTEN >/dev/null 2>&1 && break
            sleep 1
          done
          [ -n "$pid" ] || { echo "Leftover.app didn't start"; exit 1; }
          lsof -nP -a -p "$pid" -iTCP@127.0.0.1 -sTCP:LISTEN
          kill "$pid"

      - name: leftover-linux-amd64.deb
        if: runner.os == 'Linux'
        run: |
          set -eu
          sh scripts/package-deb.sh 0.0.0 dist amd64
          dpkg-deb --info dist/leftover-linux-amd64.deb
          sudo apt-get install -y -qq ./dist/leftover-linux-amd64.deb
          leftover --version
          test -x /usr/bin/leftover
          test -f /usr/share/applications/leftover.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/leftover.svg
          # What the app-menu entry runs, without opening a browser.
          timeout 5 leftover app --no-open | tee app.txt || true
          grep -q "http://127.0.0.1:" app.txt
          sudo apt-get remove -y -qq leftover
          if [ -e /usr/bin/leftover ] || [ -e /usr/share/applications/leftover.desktop ]; then echo "files left behind after removing the package"; exit 1; fi

      - name: Leftover-Setup.exe
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          scripts/package-windows.ps1 -Version 0.0.0 -Out dist

          Start-Process dist\Leftover-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Leftover"
          & "$dir\leftover.exe" --version
          if ($LASTEXITCODE) { throw "leftover.exe didn't run" }
          if (-not (Test-Path "$dir\leftoverw.exe")) { throw "no leftoverw.exe" }
          $lnk = Join-Path ([Environment]::GetFolderPath("Programs")) "Leftover.lnk"
          if (-not (Test-Path $lnk)) { throw "no Start menu shortcut at $lnk" }
          $userPath = (Get-ItemProperty HKCU:\Environment).Path
          if ($userPath -notlike "*$dir*") { throw "the install folder isn't on the user PATH" }
          if (-not (Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -eq "Leftover" })) { throw "not listed in Settings > Apps" }

          # Open it from the Start menu shortcut and wait for the window's server.
          Start-Process $lnk
          $up = $false
          foreach ($i in 1..30) {
            $p = Get-Process leftoverw -ErrorAction SilentlyContinue
            if ($p -and (Get-NetTCPConnection -OwningProcess $p.Id -State Listen -ErrorAction SilentlyContinue | Where-Object LocalAddress -eq "127.0.0.1")) { $up = $true; break }
            Start-Sleep 1
          }
          if (-not $up) { throw "Leftover didn't start from the Start menu" }
          Stop-Process -Name leftoverw -Force

          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          foreach ($i in 1..30) { if (-not (Test-Path "$dir\leftover.exe")) { break }; Start-Sleep 1 }
          if (Test-Path "$dir\leftover.exe") { throw "uninstall left leftover.exe behind" }
          if (Test-Path $lnk) { throw "uninstall left the Start menu shortcut" }
          if ((Get-ItemProperty HKCU:\Environment).Path -like "*$dir*") { throw "uninstall left the folder on PATH" }
          Write-Host "Leftover-Setup.exe installs, opens and uninstalls cleanly"
