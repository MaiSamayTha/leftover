name: release

# Push a tag like v0.1.1 to build every platform, write checksums and publish
# a GitHub release. Besides the plain archives (used by the install scripts,
# Homebrew and Scoop), each release has a proper app for people who don't use
# a terminal: Leftover.dmg for macOS, Leftover-Setup.exe for Windows and .deb
# packages for Linux. The website's Download button links to those.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./... && sh scripts/e2e.sh
      - name: build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}; goarch=${target#*/}
            name=$goos; [ "$goos" = darwin ] && name=macos
            stage="build/leftover-$name-$goarch"
            mkdir -p "$stage"
            exe=leftover; [ "$goos" = windows ] && exe=leftover.exe
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION#v}" -o "$stage/$exe" ./cmd/leftover
            cp LICENSE README.md "$stage/"
            case $goos in
              darwin) cp assets/leftover.icns "$stage/" ;;
              linux) cp assets/leftover.svg "$stage/" ;;
              windows) cp assets/leftover.ico "$stage/" ;;
            esac
            if [ "$goos" = windows ]; then
              (cd "$stage" && zip -q -9 "../../dist/leftover-$name-$goarch.zip" *)
            else
              tar -C "$stage" -czf "dist/leftover-$name-$goarch.tar.gz" .
            fi
          done
      - name: build .deb packages
        run: sh scripts/package-deb.sh "${{ github.ref_name }}" dist amd64 arm64
      - uses: actions/upload-artifact@v4
        with:
          name: archives
          path: dist/*

  macos-app:
    runs-on: macos-latest
    env:
      CAN_SIGN: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Only when the Apple secrets exist: sign with a Developer ID and
      # notarize, so the app opens without a Gatekeeper warning. Without
      # them the app is ad-hoc signed and people approve it once.
      - name: import the signing certificate
        if: env.CAN_SIGN == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(openssl rand -hex 16)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: build Leftover.dmg
        env:
          MACOS_SIGN_IDENTITY: ${{ env.CAN_SIGN == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: sh scripts/package-macos.sh "${{ github.ref_name }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            dist/Leftover.dmg
            dist/Leftover-macos.zip

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install Inno Setup if missing
        shell: powershell
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: build Leftover-Setup.exe
        shell: powershell
        run: scripts/package-windows.ps1 -Version "${{ github.ref_name }}" -Out dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/Leftover-Setup.exe

  publish:
    needs: [archives, macos-app, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: (cd dist && sha256sum * > checksums.txt && cat checksums.txt)
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Sign the checksums so Leftover's Update now can tell a real release
      # from a tampered one. Without the key the release still publishes,
      # but the app won't install it by itself.
      - name: sign checksums
        env:
          LEFTOVER_UPDATE_KEY: ${{ secrets.LEFTOVER_UPDATE_KEY }}
        run: |
          if [ -n "$LEFTOVER_UPDATE_KEY" ]; then
            go run ./tools/sign sign dist/checksums.txt
          else
            echo "::warning::LEFTOVER_UPDATE_KEY isn't set; this release can't be installed by Update now"
          fi
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/release-notes.sh "${{ github.ref_name }}" > notes.md
          gh release create "${{ github.ref_name }}" dist/* \
            --title "Leftover ${{ github.ref_name }}" \
            --notes-file notes.md
      # Point the Homebrew formula and Scoop manifest at the new release. Both
      # live in this repo (Formula/ and bucket/), so the tap and bucket are
      # this repository itself.
      - name: update homebrew and scoop
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          git fetch origin main
          git checkout -B main origin/main
          sh scripts/packages.sh "$VERSION" dist/checksums.txt .
          git add Formula/leftover.rb bucket/leftover.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "packages: point Homebrew and Scoop at $VERSION"
          git push origin main
