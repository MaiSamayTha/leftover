name: Bug report
description: Report something that does not work as expected.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please avoid pasting secrets or private paths.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command you ran and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `leftover ...`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Leftover version
      description: Output of `leftover --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: macOS 15.2, Ubuntu 24.04, Windows 11...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Redact tokens, usernames, and private paths.
      render: shell
    validations:
      required: false
